<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Drizzle server</title>
    <style>
      table {
        border: 1px solid black;
        border-collapse: collapse;
      }
      table th,
      table td {
        border: 1px solid black;
      }
    </style>
  </head>
  <body>
    <div>
      <form id="user-form">
        <fieldset>
          <legend>사용자 등록</legend>
          <div>
            <label for="email">이메일</label>
            <input id="email" type="email" placeholder="이메일" />
          </div>
          <div>
            <label for="name">이름</label>
            <input id="name" type="text" placeholder="이름" />
          </div>
          <div>
            <label for="age">나이</label>
            <input id="age" type="text" placeholder="나이" />
          </div>
          <div>
            <label for="memo">메모</label>
            <textarea id="memo" placeholder="메모"></textarea>
          </div>

          <button>등록</button>
        </fieldset>
      </form>
    </div>

    <br />

    <table id="user-list">
      <thead>
        <tr>
          <th>이메일</th>
          <th>이름</th>
          <th>나이</th>
          <th>memo</th>
        </tr>
      </thead>
      <tbody>
        {% for user in users %}
        <tr>
          <td>{{user.email}}</td>
          <td>{{user.name}}</td>
          <td>{{user.age}}</td>
          <td>{{user.memo}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <br />

    <div>
      <form id="comment-form">
        <fieldset>
          <legend>댓글 등록</legend>
          <div>
            <input id="userid" type="text" placeholder="사용자 아이디" />
          </div>
          <div><input id="comment" type="text" placeholder="댓글" /></div>
          <button>등록</button>
        </fieldset>
      </form>
    </div>

    <br />

    <table id="comment-list">
      <thead>
        <tr>
          <th>아이디</th>
          <th>작성자</th>
          <th>댓글</th>
          <th>수정</th>
          <th>삭제</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/drizzle.js"></script>
  </body>
</html>
